name: Build Meal Planner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          unzip -q MealPlanner-v3-Enhanced-UI.zip
          echo "Finding Android project..."
          find . -name settings.gradle -o -name build.gradle

      - name: Find project directory
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -name app-debug.apk | head -1)
          echo "APK found at: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MealPlanner-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
