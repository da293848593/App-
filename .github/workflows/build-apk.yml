name: Build Meal Planner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Unpack Meal Planner project
        run: |
          unzip -q MealPlanner-v3-Enhanced-UI.zip
          echo "Project contents:"
          find MealPlanner-v3 -maxdepth 3 -type f | sort

      - name: Build APK
        working-directory: MealPlanner-v3
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MealPlanner-APK
          path: MealPlanner-v3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
